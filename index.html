<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia Orbital · Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ceu:#7fd0ff;--ceu2:#3a9bf0;--noite:#030d24;--painel:rgba(7,22,54,.78);--borda:rgba(140,205,255,.35);--texto:#eaf6ff;--suave:#a9cbe6}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--texto);font:16px/1.5 'Outfit',system-ui,sans-serif;background:linear-gradient(180deg,#020817 0%,#06204a 45%,#0f5fa8 80%,#4fb0ec 100%) fixed}
.espaco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.estrela{position:absolute;background:#fff;border-radius:50%;animation:pisca 4s infinite ease-in-out}
@keyframes pisca{50%{opacity:.25}}
.terra{position:absolute;left:50%;bottom:-38vmin;width:96vmin;height:96vmin;transform:translateX(-50%);filter:drop-shadow(0 0 38px rgba(110,205,255,.65))}
.continentes{animation:gira 70s linear infinite}
.nuvens{animation:gira 45s linear infinite}
@keyframes gira{to{transform:translateX(-200px)}}
.lua{position:absolute;top:5vmin;right:6vmin;width:15vmin;min-width:70px;animation:flutua 9s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(190,225,255,.45))}
@keyframes flutua{50%{transform:translateY(12px)}}
.cometa{position:absolute;top:12%;left:-10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(18deg);animation:cometa 11s infinite 3s;opacity:0}
@keyframes cometa{0%{opacity:0;left:-10%}6%{opacity:1}22%{opacity:0;left:70%;top:34%}100%{opacity:0}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 42vmin}
.marca{font:1.35rem 'Michroma',sans-serif;letter-spacing:.06em;text-align:center;margin:6px 0 4px}
.sub{text-align:center;color:var(--suave);margin:0 0 22px}
.painel{background:var(--painel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--borda);border-radius:18px;padding:22px}
h2{font:1.05rem 'Michroma',sans-serif;margin:0 0 14px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.abas button{background:transparent;color:var(--suave);border:1px solid var(--borda);padding:10px;border-radius:10px;font:inherit;cursor:pointer}
.abas button[aria-selected=true]{background:var(--ceu);color:#021633;border-color:var(--ceu);font-weight:600}
label.campo{display:block;margin-bottom:12px;font-size:.92rem;color:var(--suave)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date]{width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--borda);background:rgba(2,12,34,.7);color:var(--texto);font:inherit;color-scheme:dark}
input:focus-visible,button:focus-visible,a:focus-visible,.opcoes input:focus-visible+label{outline:3px solid var(--ceu);outline-offset:2px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#8fd8ff,#3a9bf0);color:#021633;font:600 1rem 'Outfit',sans-serif;cursor:pointer;text-align:center;text-decoration:none;margin-top:8px}
.btn.sec{background:transparent;color:var(--texto);border:1px solid var(--borda)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:12px;padding:12px;border-radius:10px;display:none;font-size:.95rem}
.msg.erro{display:block;background:#4a1620;color:#ffd6dc}
.msg.ok{display:block;background:#0f3b2c;color:#c9f7e0}
.cards{display:grid;gap:10px;margin:14px 0}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.social a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--borda);border-radius:12px;color:var(--texto);text-decoration:none;background:rgba(255,255,255,.05)}
.social svg{width:22px;height:22px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font:.95rem 'Michroma',sans-serif;margin-bottom:10px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes input{position:absolute;opacity:0}
.opcoes label{border:1px solid var(--borda);background:rgba(255,255,255,.05);padding:10px 14px;border-radius:10px;cursor:pointer;min-width:78px;text-align:center}
.opcoes input:checked+label{background:var(--ceu);color:#021633;border-color:var(--ceu);font-weight:600}
.opcoes small{display:block;opacity:.8}
.aviso{color:var(--suave);margin:0 0 10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:10px}
.item button{background:transparent;color:#ffb4bf;border:1px solid #8a3a47;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="espaco" aria-hidden="true">
  <div id="estrelas"></div><div class="cometa"></div>
  <svg class="lua" viewBox="0 0 100 100"><defs><radialGradient id="lg" cx=".35" cy=".3"><stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#8da9c8"/></radialGradient></defs>
    <circle cx="50" cy="50" r="48" fill="url(#lg)"/><g fill="#7893b3" opacity=".55"><circle cx="34" cy="38" r="9"/><circle cx="64" cy="30" r="5"/><circle cx="62" cy="62" r="11"/><circle cx="30" cy="68" r="6"/></g></svg>
  <svg class="terra" viewBox="0 0 200 200"><defs>
    <radialGradient id="oc" cx=".35" cy=".3"><stop offset="0" stop-color="#63c8ff"/><stop offset=".6" stop-color="#1f70d4"/><stop offset="1" stop-color="#0a2f77"/></radialGradient>
    <radialGradient id="sb" cx=".35" cy=".3" r=".85"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#00102e" stop-opacity=".65"/></radialGradient>
    <clipPath id="rec"><circle cx="100" cy="100" r="98"/></clipPath></defs>
    <circle cx="100" cy="100" r="98" fill="url(#oc)"/>
    <g clip-path="url(#rec)">
      <g class="continentes" fill="#4fae6e"><g id="cont">
        <path d="M20 70C30 50 60 45 70 65C78 80 60 100 50 115C40 125 25 110 22 95Z"/>
        <path d="M95 55C110 45 140 50 150 65C160 80 150 95 135 100C120 105 105 90 98 78Z"/>
        <path d="M120 125C135 118 160 125 165 140C168 155 145 165 130 160C118 152 112 135 120 125Z"/>
        <circle cx="80" cy="150" r="9"/></g><use href="#cont" x="200"/></g>
      <g class="nuvens" fill="#fff" opacity=".55"><g id="nv"><ellipse cx="45" cy="60" rx="22" ry="5"/><ellipse cx="120" cy="90" rx="26" ry="5"/><ellipse cx="160" cy="140" rx="20" ry="4"/><ellipse cx="70" cy="130" rx="18" ry="4"/></g><use href="#nv" x="200"/></g>
    </g>
    <circle cx="100" cy="100" r="98" fill="url(#sb)"/></svg>
</div>

<main>
  <h1 class="marca">BARBEARIA ORBITAL</h1>
  <p class="sub">Corte de outro mundo, horário marcado na Terra.</p>

  <!-- LOGIN -->
  <section class="painel" id="t-login">
    <div class="abas" role="tablist">
      <button type="button" id="aba-entrar" role="tab" aria-selected="true">Entrar</button>
      <button type="button" id="aba-registrar" role="tab" aria-selected="false">Criar conta</button>
    </div>
    <form id="f-login">
      <div id="campos-reg" hidden>
        <label class="campo">Nome<input type="text" id="nome" autocomplete="name"></label>
        <label class="campo">Telefone com DDD<input type="tel" id="tel" autocomplete="tel"></label>
      </div>
      <label class="campo">E-mail<input type="email" id="email" required autocomplete="email"></label>
      <label class="campo">Senha (mínimo 6 caracteres)<input type="password" id="senha" required minlength="6" autocomplete="current-password"></label>
      <button class="btn" id="btn-login">Entrar</button>
      <div class="msg" id="msg-login" role="alert"></div>
    </form>
  </section>

  <!-- INÍCIO -->
  <section class="painel" id="t-home" hidden>
    <h2 id="ola">Olá</h2>
    <div class="cards">
      <button class="btn" id="ir-agendar">Agendar horário</button>
      <button class="btn sec" id="ir-meus">Meus agendamentos</button>
    </div>
    <div class="social">
      <a id="lk-whats" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8c.3 3 3 5.7 6 6l1.3-1.3-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>WhatsApp</a>
      <a id="lk-insta" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#ff7ab8" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#ff7ab8"/></svg>Instagram</a>
    </div>
    <button class="btn sec" id="sair" style="margin-top:16px">Sair da conta</button>
  </section>

  <!-- AGENDAR -->
  <section class="painel" id="t-agendar" hidden>
    <h2>Novo agendamento</h2>
    <form id="f-ag">
      <fieldset><legend>Serviço</legend><div class="opcoes" id="servicos"></div></fieldset>
      <fieldset><legend>Barbeiro</legend><div class="opcoes" id="barbeiros"></div></fieldset>
      <fieldset><legend>Dia</legend><input type="date" id="data" required></fieldset>
      <fieldset><legend>Horário</legend><p class="aviso" id="avisoH">Escolha barbeiro e dia para ver os horários.</p><div class="opcoes" id="horarios"></div></fieldset>
      <button class="btn" id="btn-ag">Confirmar agendamento</button>
      <div class="msg" id="msg-ag" role="status"></div>
    </form>
    <button class="btn sec" data-voltar>Voltar</button>
  </section>

  <!-- MEUS -->
  <section class="painel" id="t-meus" hidden>
    <h2>Meus agendamentos</h2>
    <div id="lista"></div>
    <div class="msg" id="msg-meus" role="status"></div>
    <button class="btn sec" data-voltar>Voltar</button>
  </section>
</main>

<script>
// ===== CONFIGURE AQUI =====
const API = 'https://script.google.com/macros/s/AKfycbwvEuUdL--hdC8k1h64UI5T9GWWGBv-oJDUckoJLgY9mG6d4beAF7HmFkgEAXAvyEgUSg/exec';
const WHATSAPP = '5561999999999';   // número da barbearia: 55 + DDD + número, só dígitos
const INSTAGRAM = 'suabarbearia';   // @ do Instagram, sem o @
// ==========================

const $ = id => document.getElementById(id);
let sessao = null, config = null, modo = 'entrar';
try { sessao = JSON.parse(localStorage.getItem('sessao') || 'null'); } catch (e) {}

// estrelas
(function(){const el=$('estrelas');for(let i=0;i<110;i++){const s=document.createElement('span');s.className='estrela';const t=Math.random()*2.2+.6;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;width:${t}px;height:${t}px;animation-delay:${Math.random()*4}s`;el.appendChild(s);}})();

$('lk-whats').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá! Gostaria de falar sobre um horário.');
$('lk-insta').href = 'https://instagram.com/' + INSTAGRAM;

function post(corpo) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) }).then(r => r.json());
}
function aviso(id, tipo, texto) { const m = $(id); m.className = 'msg ' + tipo; m.textContent = texto; }
function limpar(id) { const m = $(id); m.className = 'msg'; m.textContent = ''; }
function sair() { sessao = null; try { localStorage.removeItem('sessao'); } catch (e) {} mostrar('login'); }
function checar(r, msgId) { if (r.expirada) { sair(); aviso('msg-login', 'erro', r.erro); return false; } if (!r.ok) { aviso(msgId, 'erro', r.erro); return false; } return true; }

function mostrar(tela) {
  ['login','home','agendar','meus'].forEach(n => $('t-' + n).hidden = n !== tela);
  window.scrollTo(0, 0);
  if (tela === 'home') $('ola').textContent = 'Olá, ' + sessao.nome.split(' ')[0];
  if (tela === 'agendar') prepararAgendar();
  if (tela === 'meus') carregarMeus();
}

// ---- login / cadastro ----
function setModo(m) {
  modo = m;
  $('campos-reg').hidden = m !== 'registrar';
  $('nome').required = $('tel').required = m === 'registrar';
  $('aba-entrar').setAttribute('aria-selected', m === 'entrar');
  $('aba-registrar').setAttribute('aria-selected', m === 'registrar');
  $('btn-login').textContent = m === 'entrar' ? 'Entrar' : 'Criar minha conta';
  $('senha').autocomplete = m === 'entrar' ? 'current-password' : 'new-password';
  limpar('msg-login');
}
$('aba-entrar').onclick = () => setModo('entrar');
$('aba-registrar').onclick = () => setModo('registrar');

$('f-login').addEventListener('submit', async e => {
  e.preventDefault(); limpar('msg-login'); $('btn-login').disabled = true;
  try {
    const r = await post({ action: modo, email: $('email').value, senha: $('senha').value, nome: $('nome').value, telefone: $('tel').value });
    if (checar(r, 'msg-login')) {
      sessao = { token: r.token, nome: r.nome, email: r.email, telefone: r.telefone };
      try { localStorage.setItem('sessao', JSON.stringify(sessao)); } catch (e) {}
      $('f-login').reset(); mostrar('home');
    }
  } catch (err) { aviso('msg-login', 'erro', 'Não foi possível conectar. Tente de novo.'); }
  $('btn-login').disabled = false;
});

// ---- navegação ----
$('ir-agendar').onclick = () => mostrar('agendar');
$('ir-meus').onclick = () => mostrar('meus');
$('sair').onclick = sair;
document.querySelectorAll('[data-voltar]').forEach(b => b.onclick = () => mostrar('home'));

// ---- agendar ----
function radios(el, nome, itens, rotulo) {
  el.innerHTML = itens.map((it, i) => `<span><input type="radio" name="${nome}" id="${nome}${i}" value="${it.valor}" required><label for="${nome}${i}">${rotulo(it)}</label></span>`).join('');
}
const marcado = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

async function prepararAgendar() {
  limpar('msg-ag'); $('f-ag').reset(); $('horarios').innerHTML = ''; $('avisoH').textContent = 'Escolha barbeiro e dia para ver os horários.';
  $('data').min = hojeISO();
  if (!config) {
    try { config = await (await fetch(API + '?action=config')).json(); }
    catch (e) { aviso('msg-ag', 'erro', 'Erro ao carregar. Tente de novo.'); return; }
  }
  radios($('servicos'), 'servico', config.servicos.map(s => ({ valor: s.nome, preco: s.preco })), s => `${s.valor}<small>R$ ${s.preco}</small>`);
  radios($('barbeiros'), 'barbeiro', config.barbeiros.map(b => ({ valor: b })), b => b.valor);
}
$('barbeiros').addEventListener('change', carregarHorarios);
$('data').addEventListener('change', carregarHorarios);

async function carregarHorarios() {
  const barbeiro = marcado('barbeiro'), data = $('data').value;
  if (!barbeiro || !data) return;
  $('horarios').innerHTML = ''; $('avisoH').textContent = 'Carregando…';
  try {
    const r = await (await fetch(`${API}?action=slots&data=${data}&barbeiro=${encodeURIComponent(barbeiro)}`)).json();
    let livres = r.livres;
    if (data === hojeISO()) { const agora = new Date().toTimeString().slice(0, 5); livres = livres.filter(h => h > agora); }
    $('avisoH').textContent = livres.length ? '' : 'Sem horários livres nesse dia. Tente outra data.';
    radios($('horarios'), 'hora', livres.map(h => ({ valor: h })), h => h.valor);
  } catch (e) { $('avisoH').textContent = 'Erro ao carregar horários.'; }
}

$('f-ag').addEventListener('submit', async e => {
  e.preventDefault(); limpar('msg-ag'); $('btn-ag').disabled = true;
  try {
    const r = await post({ action: 'agendar', token: sessao.token, servico: marcado('servico'), barbeiro: marcado('barbeiro'), data: $('data').value, hora: marcado('hora') });
    if (checar(r, 'msg-ag')) {
      aviso('msg-ag', 'ok', `Agendado! ${$('data').value.split('-').reverse().join('/')} às ${marcado('hora')} com ${marcado('barbeiro')}.`);
      $('f-ag').reset(); $('horarios').innerHTML = '';
    } else carregarHorarios();
  } catch (err) { aviso('msg-ag', 'erro', 'Não foi possível agendar. Verifique a conexão.'); }
  $('btn-ag').disabled = false;
});

// ---- meus agendamentos ----
async function carregarMeus() {
  limpar('msg-meus'); $('lista').textContent = 'Carregando…';
  try {
    const r = await post({ action: 'meus', token: sessao.token });
    if (!checar(r, 'msg-meus')) { $('lista').textContent = ''; return; }
    $('lista').textContent = '';
    if (!r.lista.length) { $('lista').textContent = 'Você não tem agendamentos futuros.'; return; }
    r.lista.forEach(a => {
      const d = document.createElement('div'); d.className = 'item';
      const t = document.createElement('div');
      t.textContent = `${a.data.split('-').reverse().join('/')} às ${a.hora} · ${a.servico} com ${a.barbeiro}`;
      const b = document.createElement('button'); b.textContent = 'Cancelar';
      b.onclick = async () => {
        if (!confirm('Cancelar este agendamento?')) return;
        b.disabled = true;
        const x = await post({ action: 'cancelar', token: sessao.token, data: a.data, hora: a.hora, barbeiro: a.barbeiro });
        if (checar(x, 'msg-meus')) carregarMeus(); else b.disabled = false;
      };
      d.append(t, b); $('lista').appendChild(d);
    });
  } catch (e) { $('lista').textContent = ''; aviso('msg-meus', 'erro', 'Erro ao carregar seus agendamentos.'); }
}

mostrar(sessao && sessao.token ? 'home' : 'login');
</script>
</body>
</html>
