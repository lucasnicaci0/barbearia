<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agende seu horário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#1c2b4a;--vermelho:#c8352f;--papel:#f6f5f2;--linha:#d9d7d0;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--azul);font:16px/1.5 'Work Sans',system-ui,sans-serif}
header{background:var(--azul);color:#fff;padding:28px 20px 24px;border-bottom:10px solid;border-image:repeating-linear-gradient(135deg,var(--vermelho) 0 14px,#fff 14px 28px,var(--azul) 28px 42px) 10}
h1{font:2rem 'Archivo Black',sans-serif;margin:0;max-width:640px;margin-inline:auto}
header p{max-width:640px;margin:6px auto 0;opacity:.85}
main{max-width:640px;margin:0 auto;padding:20px}
fieldset{border:0;padding:0;margin:0 0 26px}
legend{font:1.1rem 'Archivo Black',sans-serif;margin-bottom:10px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes input{position:absolute;opacity:0}
.opcoes label{border:2px solid var(--linha);background:#fff;padding:10px 14px;border-radius:6px;cursor:pointer;min-width:84px;text-align:center}
.opcoes input:checked+label{border-color:var(--azul);background:var(--azul);color:#fff}
.opcoes input:focus-visible+label{outline:3px solid var(--vermelho);outline-offset:2px}
.opcoes small{display:block;opacity:.7}
input[type=date],input[type=text],input[type=tel]{width:100%;padding:12px;border:2px solid var(--linha);border-radius:6px;font:inherit;background:#fff;margin-bottom:10px}
button{width:100%;padding:16px;border:0;border-radius:6px;background:var(--vermelho);color:#fff;font:1.05rem 'Archivo Black',sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.aviso{margin:0 0 12px;opacity:.75}
#msg{margin-top:14px;padding:14px;border-radius:6px;display:none}
#msg.ok{display:block;background:#e3f2e9;color:var(--ok)}
#msg.erro{display:block;background:#fbe5e3;color:#9a2620}
</style>
</head>
<body>
<header><h1>Agende seu horário</h1><p>Escolha o serviço, o barbeiro e o melhor horário.</p></header>
<main>
<form id="f">
  <fieldset><legend>Serviço</legend><div class="opcoes" id="servicos"></div></fieldset>
  <fieldset><legend>Barbeiro</legend><div class="opcoes" id="barbeiros"></div></fieldset>
  <fieldset><legend>Dia</legend><input type="date" id="data" required></fieldset>
  <fieldset><legend>Horário</legend>
    <p class="aviso" id="avisoH">Escolha barbeiro e dia para ver os horários.</p>
    <div class="opcoes" id="horarios"></div></fieldset>
  <fieldset><legend>Seus dados</legend>
    <input type="text" id="nome" placeholder="Nome" required autocomplete="name">
    <input type="tel" id="tel" placeholder="Telefone com DDD" required autocomplete="tel">
  </fieldset>
  <button id="btn">Confirmar agendamento</button>
  <div id="msg" role="status"></div>
</form>
</main>
<script>
// Cole aqui a URL do seu Apps Script (termina em /exec)
const API = 'https://script.google.com/macros/s/AKfycbwvEuUdL--hdC8k1h64UI5T9GWWGBv-oJDUckoJLgY9mG6d4beAF7HmFkgEAXAvyEgUSg/exec';

const $ = id => document.getElementById(id);
const hoje = new Date(); hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
$('data').min = hoje.toISOString().slice(0, 10);

function radios(el, nome, itens, rotulo) {
  el.innerHTML = itens.map((it, i) =>
    `<span><input type="radio" name="${nome}" id="${nome}${i}" value="${it.valor}" required>
     <label for="${nome}${i}">${rotulo(it)}</label></span>`).join('');
}
const marcado = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;

async function iniciar() {
  const c = await (await fetch(API + '?action=config')).json();
  radios($('servicos'), 'servico', c.servicos.map(s => ({ valor: s.nome, preco: s.preco })),
    s => `${s.valor}<small>R$ ${s.preco}</small>`);
  radios($('barbeiros'), 'barbeiro', c.barbeiros.map(b => ({ valor: b })), b => b.valor);
  $('barbeiros').addEventListener('change', carregarHorarios);
  $('data').addEventListener('change', carregarHorarios);
}

async function carregarHorarios() {
  const barbeiro = marcado('barbeiro'), data = $('data').value;
  if (!barbeiro || !data) return;
  $('horarios').innerHTML = ''; $('avisoH').textContent = 'Carregando…';
  const r = await (await fetch(`${API}?action=slots&data=${data}&barbeiro=${encodeURIComponent(barbeiro)}`)).json();
  let livres = r.livres;
  if (data === hoje.toISOString().slice(0, 10)) { // esconde horários que já passaram
    const agora = new Date().toTimeString().slice(0, 5);
    livres = livres.filter(h => h > agora);
  }
  $('avisoH').textContent = livres.length ? '' : 'Sem horários livres nesse dia. Tente outra data.';
  radios($('horarios'), 'hora', livres.map(h => ({ valor: h })), h => h.valor);
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'); msg.className = ''; msg.style.display = 'none';
  $('btn').disabled = true;
  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita bloqueio CORS
      body: JSON.stringify({
        servico: marcado('servico'), barbeiro: marcado('barbeiro'),
        data: $('data').value, hora: marcado('hora'),
        nome: $('nome').value.trim(), telefone: $('tel').value.trim()
      })
    });
    const r = await resp.json();
    if (r.ok) {
      msg.className = 'ok';
      msg.textContent = `Agendado! ${$('data').value.split('-').reverse().join('/')} às ${marcado('hora')} com ${marcado('barbeiro')}.`;
      $('f').reset();
      $('horarios').innerHTML = '';
    } else { msg.className = 'erro'; msg.textContent = r.erro; carregarHorarios(); }
  } catch (err) {
    msg.className = 'erro'; msg.textContent = 'Não foi possível agendar. Verifique a conexão e tente de novo.';
  }
  $('btn').disabled = false;
});

iniciar().catch(() => { $('avisoH').textContent = 'Erro ao carregar. Confira a URL da API no código.'; });
</script>
</body>
</html>
