<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia Orbital · Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ceu:#7fd0ff;--painel:rgba(5,16,40,.8);--borda:rgba(140,205,255,.32);--texto:#eaf6ff;--suave:#a9cbe6}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--texto);font:16px/1.5 'Outfit',system-ui,sans-serif;background:linear-gradient(180deg,#01030a 0%,#041028 55%,#0a2a57 100%) fixed}

/* ===== CENÁRIO: invasão alienígena sobre a Terra ===== */
.espaco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.estrela{position:absolute;background:#fff;border-radius:50%;animation:pisca 4s infinite ease-in-out}
@keyframes pisca{50%{opacity:.25}}
.nebulosa{position:absolute;inset:0;background:
  radial-gradient(55% 40% at 78% 8%,rgba(60,130,220,.26),transparent 70%),
  radial-gradient(45% 35% at 10% 55%,rgba(150,60,90,.2),transparent 70%),
  radial-gradient(70% 30% at 50% 100%,rgba(90,190,255,.28),transparent 70%)}
.vinheta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,4,14,.6))}

/* planetas */
.planeta{border-radius:50%}
.sat{position:absolute;top:1vh;right:-8vmin;width:28vmin;height:28vmin;transform:rotate(-18deg);opacity:.92}
.sat .planeta{position:absolute;inset:0;background:
  radial-gradient(circle at 30% 26%,rgba(255,255,255,.4),transparent 42%),
  repeating-linear-gradient(8deg,#7fc4ee 0 6%,#559fd6 6% 11%,#a6dcf6 11% 15%,#4690cc 15% 22%);
  box-shadow:inset -3vmin -1.4vmin 5vmin rgba(0,8,30,.88),0 0 5vmin rgba(120,200,255,.3)}
.anel{position:absolute;left:-42%;top:35%;width:184%;height:30%;border-radius:50%;border:.8vmin solid rgba(200,230,255,.5);box-shadow:0 0 2vmin rgba(150,210,255,.35)}
.anel.frente{clip-path:inset(50% 0 0 0)}
.rocha{position:absolute;left:5vw;top:48vh;width:8vmin;height:8vmin;background:radial-gradient(circle at 30% 30%,#e8a67c,#a2523a 55%,#3a1a1e);box-shadow:inset -1.5vmin -.8vmin 3vmin rgba(0,0,0,.85),0 0 2vmin rgba(255,140,90,.18);opacity:.85}

/* nave-mãe */
.mae{position:absolute;top:7vh;left:-8vw;width:min(78vw,540px);opacity:.82;filter:drop-shadow(0 0 22px rgba(77,255,160,.28));animation:deriva 38s ease-in-out infinite alternate}
@keyframes deriva{to{transform:translate(9vw,3vh)}}
.luz{animation:luz 2.6s infinite steps(2,jump-none)}
@keyframes luz{50%{opacity:.25}}

/* caças */
.caca{position:absolute;left:0;width:54px;height:18px;opacity:0;animation:voo 17s linear infinite}
.caca svg{position:absolute;right:0;top:0;width:34px;height:18px;overflow:visible}
.caca::before{content:"";position:absolute;right:30px;top:7px;width:44px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--cor))}
.c1{--cor:#5dffa8;top:14vh}
.c2{--cor:#5dffa8;top:26vh;animation-duration:23s;animation-delay:6s;transform:scale(.7)}
.c3{--cor:#6ec8ff;top:36vh;animation-duration:20s;animation-delay:11s}
@keyframes voo{0%{opacity:0;translate:-12vw 0;rotate:11deg}6%{opacity:1}94%{opacity:1}100%{opacity:0;translate:112vw 24vh;rotate:11deg}}

/* tiros */
.laser{position:absolute;height:3px;width:70px;border-radius:2px;opacity:0;animation:tiro 8s linear infinite}
.laser.v{left:18%;top:30%;background:linear-gradient(90deg,transparent,#ff5a4d);box-shadow:0 0 10px #ff3b30}
.laser.g{left:70%;top:22%;width:60px;background:linear-gradient(90deg,transparent,#5dffa8);box-shadow:0 0 10px #35ff90;animation-delay:4.2s;animation-name:tiro2}
@keyframes tiro{0%{opacity:0;translate:0 0;rotate:14deg}2%{opacity:1}13%{opacity:1;translate:38vw 12vh;rotate:14deg}14%,100%{opacity:0}}
@keyframes tiro2{0%{opacity:0;translate:0 0;rotate:-166deg}2%{opacity:1}13%{opacity:1;translate:-34vw 8vh;rotate:-166deg}14%,100%{opacity:0}}

/* Terra e explosões */
.terra-wrap{position:absolute;left:50%;bottom:-40vmin;width:100vmin;height:100vmin;transform:translateX(-50%);filter:drop-shadow(0 0 30px rgba(110,200,255,.55))}
.terra{width:100%;height:100%;display:block}
.boom{position:absolute;width:9vmin;height:9vmin;margin:-4.5vmin 0 0 -4.5vmin;border-radius:50%;opacity:0;mix-blend-mode:screen;animation:boom 9s ease-out infinite;
  background:radial-gradient(circle,#fff 0,#ffe3a1 18%,#ff9a3c 40%,rgba(255,70,20,.5) 58%,rgba(255,60,20,0) 72%)}
.boom::after{content:"";position:absolute;inset:-35%;border-radius:50%;border:2px solid rgba(255,200,140,.7);opacity:0;animation:onda 9s ease-out infinite;animation-delay:inherit}
.b1{left:30%;top:12%;animation-delay:2s}
.b2{left:63%;top:8%;animation-delay:5.5s;width:7vmin;height:7vmin}
.b3{left:80%;top:24%;animation-delay:7.8s;width:6vmin;height:6vmin}
.b4{position:absolute;left:30vw;top:13vh;width:7vmin;height:7vmin;margin:0;animation-duration:12s;animation-delay:3s}
@keyframes boom{0%{opacity:0;transform:scale(.1)}2%{opacity:1;transform:scale(.7)}8%{opacity:.85;transform:scale(1.3)}20%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
@keyframes onda{0%,2%{opacity:0;transform:scale(.3)}4%{opacity:.8}22%{opacity:0;transform:scale(2.2)}100%{opacity:0}}

/* ===== INTERFACE ===== */
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 30vmin}
.marca{font:1.3rem 'Michroma',sans-serif;letter-spacing:.07em;text-align:center;margin:6px 0 4px;text-shadow:0 0 18px rgba(127,208,255,.55)}
.sub{text-align:center;color:var(--suave);margin:0 0 22px}
.painel{background:var(--painel);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid var(--borda);border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h2{font:1.05rem 'Michroma',sans-serif;margin:0 0 16px}
h3{font:.9rem 'Michroma',sans-serif;margin:0 0 10px;color:var(--ceu)}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.abas button{background:transparent;color:var(--suave);border:1px solid var(--borda);padding:10px;border-radius:10px;font:inherit;cursor:pointer}
.abas button[aria-selected=true]{background:var(--ceu);color:#021633;border-color:var(--ceu);font-weight:600}
label.campo{display:block;margin-bottom:12px;font-size:.92rem;color:var(--suave)}
input[type=text],input[type=email],input[type=password],input[type=tel]{width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--borda);background:rgba(2,12,34,.75);color:var(--texto);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ceu);outline-offset:2px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(180deg,#8fd8ff,#3a9bf0);color:#021633;font:600 1rem 'Outfit',sans-serif;cursor:pointer;text-align:center;margin-top:8px}
.btn.sec{background:transparent;color:var(--texto);border:1px solid var(--borda)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{margin-top:12px;padding:12px;border-radius:10px;display:none;font-size:.95rem}
.msg.erro{display:block;background:#4a1620;color:#ffd6dc}
.msg.ok{display:block;background:#0f3b2c;color:#c9f7e0}
.cards{display:grid;gap:10px;margin:14px 0}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.social a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--borda);border-radius:12px;color:var(--texto);text-decoration:none;background:rgba(255,255,255,.05)}
.social svg{width:22px;height:22px}
/* agendamento */
.bloco{margin-bottom:20px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.chip{border:1px solid var(--borda);background:rgba(255,255,255,.06);color:var(--texto);padding:10px 14px;border-radius:10px;font:inherit;cursor:pointer;text-align:center;min-width:72px}
.chip small{display:block;opacity:.8;font-size:.78rem}
.chip[aria-pressed=true]{background:var(--ceu);color:#021633;border-color:var(--ceu);font-weight:600}
.chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.aviso{color:var(--suave);margin:0 0 10px}
.resumo{padding:12px;border:1px dashed var(--ceu);border-radius:12px;margin-bottom:12px;background:rgba(127,208,255,.08)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--borda);border-radius:12px;margin-bottom:10px}
.item button{background:transparent;color:#ffb4bf;border:1px solid #8a3a47;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.caca,.laser{display:none}}
</style>
</head>
<body>
<div class="espaco" aria-hidden="true">
  <div id="estrelas"></div>
  <div class="nebulosa"></div>

  <div class="sat"><div class="anel"></div><div class="planeta"></div><div class="anel frente"></div></div>
  <div class="planeta rocha"></div>

  <svg class="mae" viewBox="0 0 400 150">
    <defs>
      <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a8299"/><stop offset=".5" stop-color="#25323f"/><stop offset="1" stop-color="#080d14"/></linearGradient>
      <radialGradient id="nucleo"><stop offset="0" stop-color="#e4fff0"/><stop offset=".4" stop-color="#4dffa0"/><stop offset="1" stop-color="#4dffa0" stop-opacity="0"/></radialGradient>
    </defs>
    <path d="M0 45Q90 5 200 18Q310 5 400 45Q330 62 262 72Q232 128 200 134Q168 128 138 72Q70 62 0 45Z" fill="url(#casco)" stroke="#8fb0c8" stroke-opacity=".35"/>
    <path d="M40 46Q130 34 200 38Q270 34 360 46" fill="none" stroke="#4dffa0" stroke-opacity=".7" stroke-width="1.4"/>
    <path d="M150 70Q200 56 250 70" fill="none" stroke="#4dffa0" stroke-opacity=".5" stroke-width="1.2"/>
    <g fill="#9dffd0"><circle class="luz" cx="70" cy="44" r="1.8"/><circle cx="110" cy="38" r="1.6"/><circle class="luz" cx="150" cy="34" r="1.8"/><circle cx="250" cy="34" r="1.8"/><circle class="luz" cx="290" cy="38" r="1.6"/><circle cx="330" cy="44" r="1.8"/></g>
    <circle cx="200" cy="96" r="26" fill="url(#nucleo)"/>
  </svg>

  <div class="caca c1"><svg viewBox="0 0 34 18"><path d="M0 9L26 5 34 9 26 13Z" fill="#2b3845" stroke="#9bb" stroke-opacity=".5" stroke-width=".6"/><path d="M12 8L20 0 22 8ZM12 10L20 18 22 10Z" fill="#1a232d"/><circle cx="6" cy="9" r="2.2" fill="var(--cor)"/></svg></div>
  <div class="caca c2"><svg viewBox="0 0 34 18"><path d="M0 9L26 5 34 9 26 13Z" fill="#2b3845" stroke="#9bb" stroke-opacity=".5" stroke-width=".6"/><path d="M12 8L20 0 22 8ZM12 10L20 18 22 10Z" fill="#1a232d"/><circle cx="6" cy="9" r="2.2" fill="var(--cor)"/></svg></div>
  <div class="caca c3"><svg viewBox="0 0 34 18"><path d="M0 9L28 6 34 9 28 12Z" fill="#c9d6e2" stroke="#fff" stroke-opacity=".5" stroke-width=".6"/><path d="M10 8L18 1 20 8ZM10 10L18 17 20 10Z" fill="#8296a8"/><circle cx="6" cy="9" r="2.2" fill="var(--cor)"/></svg></div>
  <div class="laser v"></div><div class="laser g"></div>
  <span class="boom b4"></span>

  <div class="terra-wrap">
    <svg class="terra" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="oc" cx=".32" cy=".28"><stop offset="0" stop-color="#6fd0ff"/><stop offset=".55" stop-color="#1f70d4"/><stop offset="1" stop-color="#082a6b"/></radialGradient>
        <radialGradient id="sb" cx=".32" cy=".28" r=".9"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#00102e" stop-opacity=".75"/></radialGradient>
        <linearGradient id="terraG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63ad6e"/><stop offset="1" stop-color="#9a8650"/></linearGradient>
        <filter id="costa" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16"/></filter>
        <filter id="nuvem" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="4" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22"/><feGaussianBlur stdDeviation="1.4"/></filter>
        <clipPath id="rec"><circle cx="100" cy="100" r="98"/></clipPath>
      </defs>
      <circle cx="100" cy="100" r="98" fill="url(#oc)"/>
      <g clip-path="url(#rec)">
        <g filter="url(#costa)" fill="url(#terraG)">
          <path d="M20 70C30 50 60 45 70 65C78 80 60 100 50 115C40 125 25 110 22 95Z"/>
          <path d="M95 55C110 45 140 50 150 65C160 80 150 95 135 100C120 105 105 90 98 78Z"/>
          <path d="M118 125C135 118 160 125 165 140C168 155 145 165 130 160C118 152 110 135 118 125Z"/>
        </g>
        <g filter="url(#nuvem)" fill="#fff" opacity=".6"><ellipse cx="50" cy="62" rx="26" ry="6"/><ellipse cx="125" cy="92" rx="30" ry="6"/><ellipse cx="160" cy="45" rx="18" ry="5"/><ellipse cx="80" cy="135" rx="24" ry="5"/></g>
      </g>
      <circle cx="100" cy="100" r="98" fill="url(#sb)"/>
      <circle cx="100" cy="100" r="98" fill="none" stroke="#9fdcff" stroke-opacity=".5" stroke-width="1.6"/>
    </svg>
    <span class="boom b1"></span><span class="boom b2"></span><span class="boom b3"></span>
  </div>
  <div class="vinheta"></div>
</div>

<main>
  <h1 class="marca">BARBEARIA ORBITAL</h1>
  <p class="sub">Invasão alienígena lá fora. Aqui dentro, só estilo.</p>

  <!-- LOGIN -->
  <section class="painel" id="t-login">
    <div class="abas" role="tablist">
      <button type="button" id="aba-entrar" role="tab" aria-selected="true">Entrar</button>
      <button type="button" id="aba-registrar" role="tab" aria-selected="false">Criar conta</button>
    </div>
    <form id="f-login">
      <div id="campos-reg" hidden>
        <label class="campo">Nome<input type="text" id="nome" autocomplete="name"></label>
        <label class="campo">Telefone com DDD<input type="tel" id="tel" autocomplete="tel"></label>
      </div>
      <label class="campo">E-mail<input type="email" id="email" required autocomplete="email"></label>
      <label class="campo">Senha (mínimo 6 caracteres)<input type="password" id="senha" required minlength="6" autocomplete="current-password"></label>
      <button class="btn" id="btn-login">Entrar</button>
      <div class="msg" id="msg-login" role="alert"></div>
    </form>
  </section>

  <!-- INÍCIO -->
  <section class="painel" id="t-home" hidden>
    <h2 id="ola">Olá</h2>
    <div class="cards">
      <button class="btn" id="ir-agendar">Agendar horário</button>
      <button class="btn sec" id="ir-meus">Meus agendamentos</button>
    </div>
    <div class="social">
      <a id="lk-whats" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8c.3 3 3 5.7 6 6l1.3-1.3-2-1-1 .8c-.9-.4-1.8-1.3-2.2-2.2l.8-1-1-2z"/></svg>WhatsApp</a>
      <a id="lk-insta" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#ff7ab8" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#ff7ab8"/></svg>Instagram</a>
    </div>
    <button class="btn sec" id="sair" style="margin-top:16px">Sair da conta</button>
  </section>

  <!-- AGENDAR (passo a passo) -->
  <section class="painel" id="t-agendar" hidden>
    <h2>Novo agendamento</h2>
    <div id="form-ag">
      <div class="bloco"><h3>1 · Serviço</h3><div class="opcoes" id="servicos"></div></div>
      <div class="bloco" id="b-barbeiro" hidden><h3>2 · Barbeiro</h3><div class="opcoes" id="barbeiros"></div></div>
      <div class="bloco" id="b-dia" hidden><h3>3 · Dia</h3><div class="opcoes" id="dias"></div></div>
      <div class="bloco" id="b-hora" hidden><h3>4 · Horário</h3><p class="aviso" id="avisoH"></p><div class="grade" id="horarios"></div></div>
      <div class="resumo" id="b-resumo" hidden></div>
      <button type="button" class="btn" id="btn-ag" disabled>Confirmar agendamento</button>
    </div>
    <div id="fim-ag" hidden>
      <div class="msg ok" style="display:block">Agendado! <strong id="fim-txt"></strong></div>
      <button type="button" class="btn" id="ver-meus">Ver meus agendamentos</button>
      <button type="button" class="btn sec" id="novo-ag">Fazer outro agendamento</button>
    </div>
    <div class="msg" id="msg-ag" role="alert"></div>
    <button type="button" class="btn sec" data-voltar>Voltar</button>
  </section>

  <!-- MEUS -->
  <section class="painel" id="t-meus" hidden>
    <h2>Meus agendamentos</h2>
    <div id="lista"></div>
    <div class="msg" id="msg-meus" role="alert"></div>
    <button type="button" class="btn sec" data-voltar>Voltar</button>
  </section>
</main>

<script>
// ===== CONFIGURE AQUI =====
const API = 'https://script.google.com/macros/s/AKfycbwvEuUdL--hdC8k1h64UI5T9GWWGBv-oJDUckoJLgY9mG6d4beAF7HmFkgEAXAvyEgUSg/exec';
const WHATSAPP = '5561999999999';   // número da barbearia: 55 + DDD + número, só dígitos
const INSTAGRAM = 'suabarbearia';   // @ do Instagram, sem o @
// ==========================

const $ = id => document.getElementById(id);
let sessao = null, config = null, modo = 'entrar';
try { sessao = JSON.parse(localStorage.getItem('sessao') || 'null'); } catch (e) {}

(function () { const el = $('estrelas'); for (let i = 0; i < 120; i++) { const s = document.createElement('span'); s.className = 'estrela'; const t = Math.random() * 2.2 + .5; s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 75}%;width:${t}px;height:${t}px;animation-delay:${Math.random() * 4}s`; el.appendChild(s); } })();

$('lk-whats').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Olá! Gostaria de falar sobre um horário.');
$('lk-insta').href = 'https://instagram.com/' + INSTAGRAM;

function post(corpo) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) }).then(r => r.json());
}
function aviso(id, tipo, texto) { const m = $(id); m.className = 'msg ' + tipo; m.textContent = texto; }
function limpar(id) { const m = $(id); m.className = 'msg'; m.textContent = ''; }
function sair() { sessao = null; try { localStorage.removeItem('sessao'); } catch (e) {} mostrar('login'); }
function checar(r, msgId) {
  if (r.expirada) { sair(); aviso('msg-login', 'erro', r.erro); return false; }
  if (!r.ok) { aviso(msgId, 'erro', r.erro || 'Algo deu errado.'); return false; }
  return true;
}
function mostrar(tela) {
  ['login', 'home', 'agendar', 'meus'].forEach(n => $('t-' + n).hidden = n !== tela);
  window.scrollTo(0, 0);
  if (tela === 'home') $('ola').textContent = 'Olá, ' + sessao.nome.split(' ')[0];
  if (tela === 'agendar') prepararAgendar();
  if (tela === 'meus') carregarMeus();
}

// ---- login / cadastro ----
function setModo(m) {
  modo = m;
  $('campos-reg').hidden = m !== 'registrar';
  $('nome').required = $('tel').required = m === 'registrar';
  $('aba-entrar').setAttribute('aria-selected', m === 'entrar');
  $('aba-registrar').setAttribute('aria-selected', m === 'registrar');
  $('btn-login').textContent = m === 'entrar' ? 'Entrar' : 'Criar minha conta';
  $('senha').autocomplete = m === 'entrar' ? 'current-password' : 'new-password';
  limpar('msg-login');
}
$('aba-entrar').onclick = () => setModo('entrar');
$('aba-registrar').onclick = () => setModo('registrar');
$('f-login').addEventListener('submit', async e => {
  e.preventDefault(); limpar('msg-login'); $('btn-login').disabled = true;
  try {
    const r = await post({ action: modo, email: $('email').value, senha: $('senha').value, nome: $('nome').value, telefone: $('tel').value });
    if (checar(r, 'msg-login')) {
      sessao = { token: r.token, nome: r.nome, email: r.email, telefone: r.telefone };
      try { localStorage.setItem('sessao', JSON.stringify(sessao)); } catch (e) {}
      $('f-login').reset(); mostrar('home');
    }
  } catch (err) { aviso('msg-login', 'erro', 'Não foi possível conectar. Tente de novo.'); }
  $('btn-login').disabled = false;
});

$('ir-agendar').onclick = () => mostrar('agendar');
$('ir-meus').onclick = () => mostrar('meus');
$('ver-meus').onclick = () => mostrar('meus');
$('novo-ag').onclick = () => prepararAgendar();
$('sair').onclick = sair;
document.querySelectorAll('[data-voltar]').forEach(b => b.onclick = () => mostrar('home'));

// ---- agendar: tudo controlado por um "estado" (sem formulário nativo) ----
const DIAS_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
let ag = {}, reqId = 0;
const br = iso => iso.split('-').reverse().join('/');
function hojeLocal() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function somarDias(iso, n) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d) + n * 864e5).toISOString().slice(0, 10); }
function diaSemana(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }

function chip(linhas, marcado, aoClicar, desligado) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.disabled = !!desligado;
  b.setAttribute('aria-pressed', marcado ? 'true' : 'false');
  b.append(linhas[0]);
  if (linhas[1]) { const s = document.createElement('small'); s.textContent = linhas[1]; b.appendChild(s); }
  b.onclick = aoClicar;
  return b;
}
function preencher(id, itens) { const el = $(id); el.textContent = ''; itens.forEach(i => el.appendChild(i)); }

async function prepararAgendar() {
  ag = { servico: null, barbeiro: null, data: null, hora: null, slots: null, enviando: false };
  reqId++; limpar('msg-ag');
  $('fim-ag').hidden = true; $('form-ag').hidden = false;
  try { config = await (await fetch(API + '?action=config')).json(); }
  catch (e) { if (!config) { aviso('msg-ag', 'erro', 'Não foi possível carregar. Verifique a conexão e tente de novo.'); return; } }
  renderAg();
}

function renderAg() {
  if (!config || !config.servicos) return;
  preencher('servicos', config.servicos.map(s => chip([s.nome, 'R$ ' + s.preco], ag.servico === s.nome, () => { limpar('msg-ag'); ag.servico = s.nome; renderAg(); })));
  $('b-barbeiro').hidden = !ag.servico;
  preencher('barbeiros', config.barbeiros.map(n => chip([n], ag.barbeiro === n, () => { limpar('msg-ag'); ag.barbeiro = n; ag.hora = null; buscarSlots(); })));
  $('b-dia').hidden = !ag.barbeiro;

  const hoje = config.hoje || hojeLocal(), total = config.dias || 14, fechados = config.diasFechados || [];
  const dias = [];
  for (let i = 0; i < total; i++) {
    const iso = somarDias(hoje, i), w = diaSemana(iso);
    dias.push(chip([DIAS_SEM[w], iso.slice(8) + '/' + iso.slice(5, 7)], ag.data === iso, () => { limpar('msg-ag'); ag.data = iso; ag.hora = null; buscarSlots(); }, fechados.indexOf(w) !== -1));
  }
  preencher('dias', dias);

  $('b-hora').hidden = !(ag.barbeiro && ag.data);
  if (ag.slots === null) { $('avisoH').textContent = 'Carregando horários…'; preencher('horarios', []); }
  else if (!ag.slots.length) { $('avisoH').textContent = 'Sem horários livres nesse dia. Escolha outro dia.'; preencher('horarios', []); }
  else { $('avisoH').textContent = ''; preencher('horarios', ag.slots.map(h => chip([h], ag.hora === h, () => { ag.hora = h; renderAg(); }))); }

  $('b-resumo').hidden = !ag.hora;
  if (ag.hora) $('b-resumo').textContent = `${ag.servico} com ${ag.barbeiro} · ${br(ag.data)} às ${ag.hora}`;
  $('btn-ag').disabled = ag.enviando || !ag.hora;
  $('btn-ag').textContent = ag.enviando ? 'Enviando…' : 'Confirmar agendamento';
}

async function buscarSlots() {
  const id = ++reqId; ag.slots = null; renderAg();
  if (!ag.barbeiro || !ag.data) return;
  try {
    const r = await (await fetch(`${API}?action=slots&data=${ag.data}&barbeiro=${encodeURIComponent(ag.barbeiro)}`)).json();
    if (id !== reqId) return; // resposta antiga, ignora
    ag.slots = r.livres || [];
  } catch (e) {
    if (id !== reqId) return;
    ag.slots = []; aviso('msg-ag', 'erro', 'Erro ao carregar os horários. Tente de novo.');
  }
  renderAg();
}

$('btn-ag').onclick = async () => {
  if (!ag.hora || ag.enviando) return;
  ag.enviando = true; limpar('msg-ag'); renderAg();
  try {
    const r = await post({ action: 'agendar', token: sessao.token, servico: ag.servico, barbeiro: ag.barbeiro, data: ag.data, hora: ag.hora });
    if (checar(r, 'msg-ag')) {
      $('fim-txt').textContent = `${br(ag.data)} às ${ag.hora} · ${ag.servico} com ${ag.barbeiro}`;
      $('form-ag').hidden = true; $('fim-ag').hidden = false;
    } else { ag.hora = null; buscarSlots(); }
  } catch (e) { aviso('msg-ag', 'erro', 'Não foi possível agendar. Verifique a conexão.'); }
  ag.enviando = false; renderAg();
};

// ---- meus agendamentos ----
async function carregarMeus() {
  limpar('msg-meus'); $('lista').textContent = 'Carregando…';
  try {
    const r = await post({ action: 'meus', token: sessao.token });
    if (!checar(r, 'msg-meus')) { $('lista').textContent = ''; return; }
    $('lista').textContent = '';
    if (!r.lista.length) { $('lista').textContent = 'Você não tem agendamentos futuros.'; return; }
    r.lista.forEach(a => {
      const d = document.createElement('div'); d.className = 'item';
      const t = document.createElement('div');
      t.textContent = `${br(a.data)} às ${a.hora} · ${a.servico} com ${a.barbeiro}`;
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Cancelar';
      b.onclick = async () => {
        if (!confirm('Cancelar este agendamento?')) return;
        b.disabled = true;
        const x = await post({ action: 'cancelar', token: sessao.token, data: a.data, hora: a.hora, barbeiro: a.barbeiro });
        if (checar(x, 'msg-meus')) carregarMeus(); else b.disabled = false;
      };
      d.append(t, b); $('lista').appendChild(d);
    });
  } catch (e) { $('lista').textContent = ''; aviso('msg-meus', 'erro', 'Erro ao carregar seus agendamentos.'); }
}

mostrar(sessao && sessao.token ? 'home' : 'login');
</script>
</body>
